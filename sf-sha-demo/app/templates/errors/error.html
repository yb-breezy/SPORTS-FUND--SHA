{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body_class %}public{% endblock %}
{% block body %}
<main class="error-wrap">
  <div class="card error-card">
    <p class="eyebrow">Error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.home') if g.user else url_for('main.index') }}">Back to the demo</a>
  </div>
</main>
{% endblock %}
